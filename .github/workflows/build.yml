name: Build Kernel - Munch

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Xiaomi Munch
    runs-on: ubuntu-22.04

    env:
      KBUILD_BUILD_USER: "DRAKEN_012"
      KBUILD_BUILD_HOST: "GitHub"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev libncurses-dev zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/clang-r487747c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Build Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Defconfig for Xiaomi Munch
          make O=out ARCH=arm64 vendor/kona-perf_defconfig vendor/xiaomi/sm8250-common.config vendor/xiaomi/munch.config

          # Compile Image and DTBs
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3

          # Copy Kernel Image
          cp out/arch/arm64/boot/Image AK3/

          # Copy DTB (injected into vendor_boot automatically)
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AK3/dtb
          elif [ -f out/arch/arm64/boot/dts/vendor/qcom/munch.dtb ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/munch.dtb AK3/dtb
          fi

          cd AK3

          # Configure AnyKernel3 script for Munch & vendor_boot
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Munch Kernel REI
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=munch
          device.name2=munchin
          device.name3=22021211RC
          device.name4=22021211RI
          device.name5=22021211RG
          supported.versions=11-17
          supported.patchlevels=
          '; } # end properties

          ### AnyKernel install
          vendor_boot_attributes() {
            set_perm_recursive 0 0 755 644 $RAMDISK/*;
            set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          ## end vendor_boot install
          EOF

          sed -i 's/^[ \t]*//' anykernel.sh

          # Clean up unnecessary repository files before packaging
          rm -rf .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Munch-Kernel-REI
          path: AK3/
